<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopify Growth Dashboard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM (Development UMD) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- PropTypes -->
    <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
    <!-- Recharts -->
    <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>
    <!-- Babel for JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script>
        // Suppress Recharts defaultProps warnings
        const originalError = console.error;
        console.error = (...args) => {
            if (typeof args[0] === 'string' && args[0].includes('Support for defaultProps will be removed')) {
                return;
            }
            originalError(...args);
        };
    </script>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useRef, useEffect } = React;
        const {
            LineChart, Line, BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, Legend, ResponsiveContainer,
            ComposedChart, PieChart, Pie, Cell, LabelList
        } = Recharts;

        // Reliable Inline SVG Icons
        const TrendingUp = ({ className = "w-4 h-4" }) => (
            <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline><polyline points="17 6 23 6 23 12"></polyline></svg>
        );
        const Users = ({ className = "w-4 h-4" }) => (
            <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
        );
        const DollarSign = ({ className = "w-4 h-4" }) => (
            <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
        );
        const Zap = ({ className = "w-4 h-4", fill="none" }) => (
            <svg className={className} fill={fill} stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
        );
        const ArrowUpRight = ({ className = "w-4 h-4" }) => (
            <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><line x1="7" y1="17" x2="17" y2="7"></line><polyline points="7 7 17 7 17 17"></polyline></svg>
        );
        const ArrowDownRight = ({ className = "w-4 h-4" }) => (
            <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><line x1="7" y1="7" x2="17" y2="17"></line><polyline points="17 7 17 17 7 17"></polyline></svg>
        );
        const LayoutList = ({ className = "w-4 h-4" }) => (
            <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
        );
        const Upload = ({ className = "w-4 h-4" }) => (
            <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
        );
        const Globe = ({ className = "w-4 h-4" }) => (
            <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
        );
        const UserMinus = ({ className = "w-4 h-4" }) => (
            <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><line x1="23" y1="11" x2="17" y2="11"></line></svg>
        );
        const FileText = ({ className = "w-4 h-4" }) => (
            <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
        );
        const CreditCard = ({ className = "w-4 h-4" }) => (
            <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect><line x1="1" y1="10" x2="23" y2="10"></line></svg>
        );
        const Calendar = ({ className = "w-4 h-4" }) => (
            <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
        );
        const Cloud = ({ className = "w-4 h-4" }) => (
            <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"></path></svg>
        );
        const CheckCircle = ({ className = "w-4 h-4" }) => (
            <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
        );
        const Filter = ({ className = "w-4 h-4" }) => (
            <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon></svg>
        );
        const CalendarDays = ({ className = "w-4 h-4" }) => (
            <svg className={className} fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line><path d="M8 14h.01"></path><path d="M12 14h.01"></path><path d="M16 14h.01"></path><path d="M8 18h.01"></path><path d="M12 18h.01"></path><path d="M16 18h.01"></path></svg>
        );

        const CHURN_ROW_HEIGHT = 56;
        const CHURN_HEADER_HEIGHT = 48;

        const INITIAL_DATA = [
            { label: '데이터 없음', newInstalls: 0, uninstalls: 0, storeClosed: 0, step1: 0, step2_1: 0, step2_2: 0, step2_3: 0, step3: 0, exposedRate: 0, paid: 0, retentionRate: 0, earlyUninstalls: 0, earlyClosed: 0, earlyChurnRate: 0 },
        ];

        const COHORT_COLORS = {
            '1. 정보 확인': '#94a3b8',
            '2-1. 색상 선택': '#60a5fa',
            '2-2. Core Snippet': '#3b82f6',
            '2-3. 위젯 설치': '#2563eb',
            '3. 완료 (최종)': '#10b981',
            '▶ 위젯 노출 여부': '#f59e0b'
        };

        const CustomScrollbarStyle = `
            .hide-scroll::-webkit-scrollbar { height: 6px; }
            .hide-scroll::-webkit-scrollbar-track { background: transparent; }
            .hide-scroll::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 10px; }
            .hide-scroll { scrollbar-width: thin; scrollbar-color: #cbd5e1 transparent; }
        `;

        const parseCSVLine = (text) => {
            const result = [];
            let cell = '';
            let inQuotes = false;
            for (let i = 0; i < text.length; i++) {
                const char = text[i];
                if (char === '"') inQuotes = !inQuotes;
                else if (char === ',' && !inQuotes) { result.push(cell); cell = ''; }
                else cell += char;
            }
            result.push(cell);
            return result;
        };

        const MetricCard = ({ title, value, subtext, icon: IconComponent, trend, customTrend }) => (
            <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-100">
                <div className="flex justify-between items-start mb-4">
                    <div className="p-2 bg-indigo-50 rounded-lg">
                        {IconComponent && <IconComponent className="w-6 h-6 text-indigo-600" />}
                    </div>
                    {customTrend ? customTrend : (trend !== null && trend !== undefined && !isNaN(trend) && trend !== 0 && (
                        <span className={`flex items-center text-sm font-medium ${trend >= 0 ? 'text-green-600' : 'text-red-600'}`}>
                            {trend >= 0 ? <ArrowUpRight className="w-4 h-4 mr-1" /> : <ArrowDownRight className="w-4 h-4 mr-1" />}
                            {Math.abs(trend)}%
                        </span>
                    ))}
                </div>
                <h3 className="text-slate-500 text-sm font-medium mb-1">{title}</h3>
                <p className="text-2xl font-bold text-slate-800">{String(value)}</p>
                {subtext && <p className="text-xs text-slate-400 mt-2 font-medium">{subtext}</p>}
            </div>
        );

        const CohortTooltip = ({ active, payload, label }) => {
            if (active && payload && payload.length) {
                const dataPoint = payload[0].payload;
                const isLegacy = dataPoint.groupKey === 'legacy';
                return (
                    <div className="bg-white p-4 rounded-xl shadow-xl border border-slate-100 min-w-[260px]">
                        <p className="font-bold text-slate-900 mb-3 border-b border-slate-50 pb-2 flex justify-between items-center">
                            <span>{String(label)}</span>
                            {!isLegacy && <span className="text-[10px] bg-slate-100 text-slate-500 px-1.5 py-0.5 rounded">Legacy 대비</span>}
                        </p>
                        <div className="space-y-4">
                            {payload.map((entry, index) => {
                                const stepName = String(entry.name);
                                const val = entry.value;
                                const prevRate = dataPoint[`${stepName}_prev`];
                                const legacyRate = dataPoint[`${stepName}_legacy`];
                                const diffNum = (Number(val) - Number(legacyRate));
                                const diff = isNaN(diffNum) ? "0.0" : diffNum.toFixed(1);
                                const isExposedStep = stepName.includes('위젯 노출');
                                return (
                                    <div key={index} className="flex flex-col text-[12px]">
                                        <div className="flex items-center justify-between mb-1">
                                            <div className="flex items-center">
                                                <div className="w-2 h-2 rounded-full mr-2" style={{ backgroundColor: entry.color || entry.fill }}></div>
                                                <span className="text-slate-600 font-medium">{stepName}</span>
                                            </div>
                                            <span className="font-black text-slate-900">{val}%</span>
                                        </div>
                                        <div className="flex items-center justify-end gap-2 text-[10px]">
                                            {!isExposedStep && prevRate !== undefined && (
                                                <div className="flex items-center text-slate-400 bg-slate-50 px-1.5 py-0.5 rounded">
                                                    <span>이전 단계:</span>
                                                    <span className="ml-1 font-bold text-slate-600">{String(prevRate)}%</span>
                                                </div>
                                            )}
                                            {!isLegacy && legacyRate !== undefined && (
                                                <div className={`flex items-center px-1.5 py-0.5 rounded font-bold ${parseFloat(diff) >= 0 ? 'bg-emerald-50 text-emerald-600' : 'bg-red-50 text-red-500'}`}>
                                                    <span>{parseFloat(diff) >= 0 ? '+' : ''}{diff}%p</span>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                );
            }
            return null;
        };

        const OnboardingTooltip = ({ active, payload, label }) => {
            if (active && payload && payload.length) {
                const dataRow = payload[0].payload;
                const installs = Number(dataRow.newInstalls || dataRow.installs) || 0;
                return (
                    <div className="bg-white p-4 rounded-xl shadow-xl border border-slate-100 min-w-[220px]">
                        <p className="font-bold text-slate-900 mb-2 border-b border-slate-50 pb-1">{String(label)}</p>
                        {installs > 0 && (
                            <p className="text-[11px] text-slate-400 mb-3 font-medium flex justify-between">
                                <span>신규 설치(기준):</span>
                                <span className="text-slate-600 font-bold">{installs}건</span>
                            </p>
                        )}
                        <div className="space-y-2">
                            {payload.map((entry, index) => {
                                const key = entry.dataKey;
                                const val = entry.value;
                                const color = entry.color || entry.stroke;
                                const isStep = key.startsWith('step');
                                const isExposed = key === 'exposedRate';
                                const isRate = key.includes('Rate');
                                let displayValue = "";
                                if (isStep || isExposed) {
                                    const countKey = key === 'step1' ? 's1' :
                                        key === 'step2_1' ? 's2_1' :
                                        key === 'step2_2' ? 's2_2' :
                                        key === 'step2_3' ? 's2_3' :
                                        key === 'step3' ? 's3' :
                                        key === 'exposedRate' ? 'exp' : null;
                                    const rawCount = countKey ? dataRow[countKey] : null;
                                    displayValue = `${val}%` + (rawCount !== null ? ` (${rawCount}건)` : "");
                                } else if (isRate) {
                                    displayValue = `${val}%`;
                                } else {
                                    displayValue = `${val}건`;
                                }
                                return (
                                    <div key={index} className="flex flex-col">
                                        <div className="flex items-center justify-between text-[12px]">
                                            <div className="flex items-center">
                                                <div className="w-2 h-2 rounded-full mr-2" style={{ backgroundColor: color }}></div>
                                                <span className="text-slate-600 font-medium">{String(entry.name)}</span>
                                            </div>
                                            <div className="text-right ml-4">
                                                <span className="font-black text-slate-900">{displayValue}</span>
                                            </div>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                );
            }
            return null;
        };

        const ViewModeSelector = ({ mode, setMode }) => (
            <div className="flex bg-slate-100 p-1 rounded-xl">
                {['daily', 'weekly', 'monthly'].map((m) => (
                    <button
                        key={m}
                        onClick={() => setMode(m)}
                        className={`px-3 py-1.5 rounded-lg text-[11px] font-bold transition-all ${
                            mode === m ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-400 hover:text-slate-600'
                        }`}
                    >
                        {m === 'daily' ? '일간' : m === 'weekly' ? '주간' : '월간'}
                    </button>
                ))}
            </div>
        );

        const DraggableChartContainer = ({ children, dataLength, mode }) => {
            const scrollRef = useRef(null);
            const [isDragging, setIsDragging] = useState(false);
            const [startX, setStartX] = useState(0);
            const [scrollLeft, setScrollLeft] = useState(0);
            const onMouseDown = e => {
                setIsDragging(true);
                setStartX(e.pageX - scrollRef.current.offsetLeft);
                setScrollLeft(scrollRef.current.scrollLeft);
            };
            const onMouseLeave = () => setIsDragging(false);
            const onMouseUp = () => setIsDragging(false);
            const onMouseMove = e => {
                if (!isDragging) return;
                e.preventDefault();
                const x = e.pageX - scrollRef.current.offsetLeft;
                const walk = (x - startX) * 1.5;
                scrollRef.current.scrollLeft = scrollLeft - walk;
            };
            const itemWidth = mode === 'daily' ? 40 : mode === 'weekly' ? 60 : 80;
            const minWidth = Math.max(0, dataLength * itemWidth);
            return (
                <div
                    ref={scrollRef}
                    className={`w-full h-full overflow-x-auto overflow-y-hidden select-none hide-scroll ${isDragging ? 'cursor-grabbing' : 'cursor-grab'}`}
                    onMouseDown={onMouseDown}
                    onMouseLeave={onMouseLeave}
                    onMouseUp={onMouseUp}
                    onMouseMove={onMouseMove}
                >
                    <div style={{ minWidth: minWidth > 0 ? `${minWidth}px` : '100%', height: '100%' }}>
                        {children}
                    </div>
                </div>
            );
        };

        function App() {
            const [rawOnboardingRows, setRawOnboardingRows] = useState([]);
            const [filterStartDate, setFilterStartDate] = useState('');
            const [filterEndDate, setFilterEndDate] = useState('');
            const [dailyStats, setDailyStats] = useState([]);
            const [weeklyData, setWeeklyData] = useState([]);
            const [monthlyStats, setMonthlyStats] = useState([]);
            const [compStats, setCompStats] = useState([]);
            const [countryStats, setCountryStats] = useState([]);
            const [churnStats, setChurnStats] = useState([]);
            const [planData, setPlanData] = useState([]);
            const [totalPaidUsers, setTotalPaidUsers] = useState(0);
            const [paidAdded, setPaidAdded] = useState(0);
            const [paidCancelled, setPaidCancelled] = useState(0);
            const [hasOnboardingData, setHasOnboardingData] = useState(false);
            const [hasPaymentData, setHasPaymentData] = useState(false);
            const [trendViewMode, setTrendViewMode] = useState('weekly');
            const [earlyChurnViewMode, setEarlyChurnViewMode] = useState('weekly');
            const [onboardingViewMode, setOnboardingViewMode] = useState('weekly');
            const [summaryViewMode, setSummaryViewMode] = useState('monthly');
            const [cohortFocus, setCohortFocus] = useState(null);

            const fileInputRef = useRef(null);

            // Robust LocalStorage initialization to survive page reloads and browser sessions
            useEffect(() => {
                try {
                    const savedOnboarding = localStorage.getItem('shopify_onboarding_csv_persistent');
                    const savedPayment = localStorage.getItem('shopify_payment_csv_persistent');
                    if (savedOnboarding) {
                        processOnboardingData(savedOnboarding);
                    }
                    if (savedPayment) {
                        processPaymentData(savedPayment);
                    }
                } catch (err) {
                    console.error("Storage load error:", err);
                }
            }, []);

            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (ev) => {
                    const text = ev.target.result;
                    try {
                        if (text.includes('앱설치일')) {
                            localStorage.setItem('shopify_onboarding_csv_persistent', text);
                            processOnboardingData(text);
                        } else if (text.includes('신청 플랜')) {
                            localStorage.setItem('shopify_payment_csv_persistent', text);
                            processPaymentData(text);
                        } else {
                            alert("올바른 Shopify CSV 파일 형식이 아닙니다.");
                        }
                    } catch (err) {
                        console.error("File processing error:", err);
                        alert("파일 처리 중 오류가 발생했습니다.");
                    }
                };
                reader.readAsText(file);
                e.target.value = null;
            };

            const processOnboardingData = (csvText) => {
                try {
                    const lines = csvText.split('\n').filter(l => l.trim().length > 5);
                    if (lines.length < 1) return;
                    const headers = parseCSVLine(lines[0]);
                    const idxDate = headers.findIndex(h => h.trim().includes('앱설치일'));
                    const idxCountry = headers.findIndex(h => h.trim().includes('국가'));
                    const idxUn = headers.findIndex(h => h.trim().includes('앱 삭제'));
                    const idxCl = headers.findIndex(h => h.trim().includes('Store closed'));
                    const idxS1 = headers.findIndex(h => h.trim().startsWith('1)'));
                    const idxS2_1 = headers.findIndex(h => h.trim().startsWith('2-1)'));
                    const idxS2_2 = headers.findIndex(h => h.trim().startsWith('2-2)'));
                    const idxS2_3 = headers.findIndex(h => h.trim().startsWith('2-3)'));
                    const idxS3 = headers.findIndex(h => h.trim().startsWith('3)'));
                    const idxExp = headers.findIndex(h => h.trim().includes('위젯 노출여부'));
                    const idxChurn = headers.findIndex(h => h.trim().includes('이탈일'));
                    const idxPaid = headers.findIndex(h => h.trim().includes('유료 결제'));

                    const dateRegex = /(\d{4})[\.\-\/]\s*(\d{1,2})[\.\-\/]\s*(\d{1,2})/;
                    const rows = [];
                    lines.slice(1).forEach(line => {
                        const cols = parseCSVLine(line);
                        if (!cols[idxDate]) return;
                        const match = cols[idxDate].replace(/["']/g, '').trim().match(dateRegex);
                        if (!match) return;
                        const yr = Number(match[1]), mo = Number(match[2]), dy = Number(match[3]);
                        const dObj = new Date(yr, mo - 1, dy);
                        const dStr = `${yr}-${String(mo).padStart(2, '0')}-${String(dy).padStart(2, '0')}`;
                        const isT = (v) => v && (v.replace(/["']/g, '').trim().toUpperCase() === 'TRUE');
                        let chDate = null;
                        if (idxChurn !== -1 && cols[idxChurn]) {
                            const cMatch = cols[idxChurn].replace(/["']/g, '').trim().match(dateRegex);
                            if (cMatch) chDate = new Date(Number(cMatch[1]), Number(cMatch[2])-1, Number(cMatch[3]));
                        }
                        rows.push({
                            rawDate: dObj, dateStr: dStr, yr, mo, country: cols[idxCountry]?.replace(/["']/g, '').trim() || 'Unknown',
                            uninstalled: isT(cols[idxUn]), closed: isT(cols[idxCl]), paid: isT(cols[idxPaid]),
                            s1: isT(cols[idxS1]), s2_1: isT(cols[idxS2_1]), s2_2: isT(cols[idxS2_2]), s2_3: isT(cols[idxS2_3]), s3: isT(cols[idxS3]), exp: isT(cols[idxExp]),
                            churnDate: chDate
                        });
                    });

                    setRawOnboardingRows(rows);
                    setHasOnboardingData(true);
                } catch (e) { console.error(e); }
            };

            useEffect(() => {
                if (!rawOnboardingRows || rawOnboardingRows.length === 0) return;

                let filteredRows = rawOnboardingRows;
                if (filterStartDate) {
                    const sDate = new Date(filterStartDate);
                    filteredRows = filteredRows.filter(r => r.rawDate >= sDate);
                }
                if (filterEndDate) {
                    const eDate = new Date(filterEndDate);
                    eDate.setHours(23, 59, 59, 999);
                    filteredRows = filteredRows.filter(r => r.rawDate <= eDate);
                }

                const mapToFinalData = (map) => Array.from(map.entries()).sort().map(([label, d]) => ({
                    label: String(label), newInstalls: d.n, uninstalls: d.un, storeClosed: d.cl, paid: d.pd,
                    earlyUninstalls: d.earlyUn, earlyClosed: d.earlyCl,
                    s1: d.s1, s2_1: d.s2_1, s2_2: d.s2_2, s2_3: d.s2_3, s3: d.s3, exp: d.exp,
                    step1: d.n ? (d.s1/d.n*100).toFixed(1) : "0.0",
                    step2_1: d.n ? (d.s2_1/d.n*100).toFixed(1) : "0.0",
                    step2_2: d.n ? (d.s2_2/d.n*100).toFixed(1) : "0.0",
                    step2_3: d.n ? (d.s2_3/d.n*100).toFixed(1) : "0.0",
                    step3: d.n ? (d.s3/d.n*100).toFixed(1) : "0.0",
                    exposedRate: d.n ? (d.exp/d.n*100).toFixed(1) : "0.0", netInstalls: Math.max(0, d.n - d.un - d.cl),
                    retentionRate: d.n ? (((Math.max(0, d.n - d.un - d.cl))/d.n)*100).toFixed(1) : "0.0",
                    earlyChurnRate: d.n ? ((d.earlyUn / d.n) * 100).toFixed(1) : "0.0"
                }));

                const dayMap = new Map(); const weekMap = new Map(); const monthMap = new Map();
                const getWkKey = (d) => { const mon = new Date(d); const diff = mon.getDate() - mon.getDay() + (mon.getDay() === 0 ? -6 : 1); mon.setDate(diff); return `${mon.getFullYear()}-${String(mon.getMonth()+1).padStart(2,'0')}-${String(mon.getDate()).padStart(2,'0')}`; };
                filteredRows.forEach(r => {
                    const keys = [r.dateStr, getWkKey(r.rawDate), `${r.yr}-${String(r.mo).padStart(2, '0')}`];
                    const maps = [dayMap, weekMap, monthMap];
                    let isEarlyChurn = false;
                    if (r.churnDate) {
                        const days = Math.ceil(Math.abs(r.churnDate - r.rawDate) / (1000 * 60 * 60 * 24));
                        if (days <= 1) isEarlyChurn = true;
                    }

                    keys.forEach((k, idx) => {
                        if(!maps[idx].has(k)) maps[idx].set(k, { n: 0, un: 0, cl: 0, earlyUn: 0, earlyCl: 0, s1:0, s2_1:0, s2_2:0, s2_3:0, s3:0, exp:0, pd:0 });
                        const m = maps[idx].get(k);
                        m.n++;
                        if(r.uninstalled) { m.un++; if(isEarlyChurn) m.earlyUn++; }
                        if(r.closed) { m.cl++; if(isEarlyChurn) m.earlyCl++; }
                        if(r.s1) m.s1++; if(r.s2_1) m.s2_1++; if(r.s2_2) m.s2_2++; if(r.s2_3) m.s2_3++; if(r.s3) m.s3++; if(r.exp) m.exp++; if(r.paid) m.pd++;
                    });
                });
                setDailyStats(mapToFinalData(dayMap)); setWeeklyData(mapToFinalData(weekMap)); setMonthlyStats(mapToFinalData(monthMap));

                const calcStats = (arr) => ({ base: arr.length, s1: arr.filter(x => x.s1).length, s2_1: arr.filter(x => x.s2_1).length, s2_2: arr.filter(x => x.s2_2).length, s2_3: arr.filter(x => x.s2_3).length, s3: arr.filter(x => x.s3).length, exp: arr.filter(x => x.exp).length });
                const cL = calcStats(filteredRows.filter(r => r.dateStr <= '2025-12-28'));
                const cI1 = calcStats(filteredRows.filter(r => r.dateStr >= '2025-12-29' && r.dateStr <= '2026-02-01'));
                const cI2 = calcStats(filteredRows.filter(r => r.dateStr >= '2026-02-02'));
                const getRates = (c, k, pk) => {
                    const rate = c.base > 0 ? (c[k]/c.base*100).toFixed(1) : "0.0";
                    const prevCount = pk === 'base' ? c.base : c[pk];
                    const prevRate = prevCount > 0 ? (c[k]/prevCount*100).toFixed(1) : "0.0";
                    return { rate, prev: prevRate };
                };

                setCompStats([{ label: '1. 정보 확인', k: 's1', pk: 'base' }, { label: '2-1. 색상 선택', k: 's2_1', pk: 's1' }, { label: '2-2. Core Snippet', k: 's2_2', pk: 's2_1' }, { label: '2-3. 위젯 설치', k: 's2_3', pk: 's2_2' }, { label: '3. 완료 (최종)', k: 's3', pk: 's2_3' }, { label: '▶ 위젯 노출 여부', k: 'exp', pk: 's3' }].map(item => {
                    const d1 = getRates(cL, item.k, item.pk);
                    const d2 = getRates(cI1, item.k, item.pk);
                    const d3 = getRates(cI2, item.k, item.pk);
                    return { step: item.label, legacy: d1, imp1: d2, imp2: d3, diff: (parseFloat(d3.rate)-parseFloat(d1.rate)).toFixed(1) };
                }));

                const churnBuckets = { '0~1일': {c:0, un:0, cl:0, s1:0, s3:0, exp:0}, '2~3일': {c:0, un:0, cl:0, s1:0, s3:0, exp:0}, '4~7일': {c:0, un:0, cl:0, s1:0, s3:0, exp:0}, '8~14일': {c:0, un:0, cl:0, s1:0, s3:0, exp:0}, '15~30일': {c:0, un:0, cl:0, s1:0, s3:0, exp:0}, '30일 이상': {c:0, un:0, cl:0, s1:0, s3:0, exp:0} };
                filteredRows.forEach(r => { if(r.churnDate) { const days = Math.ceil(Math.abs(r.churnDate - r.rawDate) / (1000 * 60 * 60 * 24)); let b = '30일 이상'; if(days<=1) b='0~1일'; else if(days<=3) b='2~3일'; else if(days<=7) b='4~7일'; else if(days<=14) b='8~14일'; else if(days<=30) b='15~30일'; const t = churnBuckets[b]; t.c++; if(r.uninstalled) t.un++; if(r.closed) t.cl++; if(r.s1) t.s1++; if(r.s3) t.s3++; if(r.exp) t.exp++; } });
                const totalChurnUninstalls = Object.values(churnBuckets).reduce((sum, b) => sum + b.un, 0);
                const totalChurnClosed = Object.values(churnBuckets).reduce((sum, b) => sum + b.cl, 0);

                setChurnStats(Object.keys(churnBuckets).map(k => ({
                    range: k, count: churnBuckets[k].c, uninstalls: churnBuckets[k].un, closed: churnBuckets[k].cl,
                    uninstallRate: totalChurnUninstalls > 0 ? ((churnBuckets[k].un / totalChurnUninstalls) * 100).toFixed(1) : 0,
                    closedRate: totalChurnClosed > 0 ? ((churnBuckets[k].cl / totalChurnClosed) * 100).toFixed(1) : 0,
                    s1Rate: churnBuckets[k].c ? (churnBuckets[k].s1/churnBuckets[k].c*100).toFixed(1) : 0,
                    s3Rate: churnBuckets[k].c ? (churnBuckets[k].s3/churnBuckets[k].c*100).toFixed(1) : 0,
                    expRate: churnBuckets[k].c ? (churnBuckets[k].exp/churnBuckets[k].c*100).toFixed(1) : 0
                })).filter(x => x.count > 0));

                const countryMapLocal = new Map();
                filteredRows.forEach(r => {
                    const cKey = r.country || 'Unknown';
                    if (!countryMapLocal.has(cKey)) countryMapLocal.set(cKey, { n: 0, un: 0, cl: 0, s3: 0, exp: 0, pd: 0 });
                    const c = countryMapLocal.get(cKey);
                    c.n++; if(r.uninstalled) c.un++; if(r.closed) c.cl++; if(r.s3) c.s3++; if(r.exp) c.exp++; if(r.paid) c.pd++;
                });
                let sortedCountries = Array.from(countryMapLocal.entries()).map(([country, d]) => ({
                    country, newInstalls: d.n, uninstalls: d.un, storeClosed: d.cl, s3: d.s3, exp: d.exp, paid: d.pd
                })).sort((a,b) => b.newInstalls - a.newInstalls);
                const top10 = sortedCountries.slice(0, 10); const othersRaw = sortedCountries.slice(10);
                let finalCountryStats = top10;
                if (othersRaw.length > 0) {
                    const othersObj = othersRaw.reduce((acc, curr) => ({
                        country: '기타 (Others)', newInstalls: acc.newInstalls + curr.newInstalls, uninstalls: acc.uninstalls + curr.uninstalls,
                        storeClosed: acc.storeClosed + curr.storeClosed, s3: acc.s3 + curr.s3, exp: acc.exp + curr.exp, paid: acc.paid + curr.paid
                    }), { country: '기타 (Others)', newInstalls: 0, uninstalls: 0, storeClosed: 0, s3: 0, exp: 0, paid: 0 });
                    finalCountryStats = [...top10, othersObj];
                }
                setCountryStats(finalCountryStats.map(d => ({
                    ...d, uninstallRate: d.newInstalls ? ((d.uninstalls/d.newInstalls)*100).toFixed(1) : "0.0",
                    closedRate: d.newInstalls ? ((d.storeClosed/d.newInstalls)*100).toFixed(1) : "0.0",
                    onboardingRate: d.newInstalls ? ((d.s3/d.newInstalls)*100).toFixed(1) : "0.0",
                    exposedRate: d.newInstalls ? ((d.exp/d.newInstalls)*100).toFixed(1) : "0.0",
                    paidRate: d.newInstalls ? ((d.paid/d.newInstalls)*100).toFixed(1) : "0.0",
                    retentionRate: d.newInstalls ? (((Math.max(0, d.newInstalls - d.uninstalls - d.storeClosed))/d.newInstalls)*100).toFixed(1) : 0
                })));
            }, [rawOnboardingRows, filterStartDate, filterEndDate]);

            const processPaymentData = (csvText) => {
                try {
                    const lines = csvText.split('\n').filter(l => l.trim().length > 2);
                    const headers = parseCSVLine(lines[0]);
                    const idxPlan = headers.findIndex(h => h.trim().includes('신청 플랜'));
                    const idxCancel = headers.findIndex(h => h.trim().includes('해지'));
                    const planCounts = { 'Flexible': 0, 'Unlimited 30': 0, 'Unlimited 365': 0 };
                    let activeTotal = 0;
                    let addedTotal = 0;
                    let cancelledTotal = 0;

                    lines.slice(1).forEach(line => {
                        const cols = parseCSVLine(line);
                        const pNameRaw = cols[idxPlan]?.replace(/["']/g, '').trim();
                        const pName = pNameRaw?.toLowerCase();
                        let isCancelled = false;
                        if (idxCancel !== -1 && cols[idxCancel]) {
                            const cancelVal = cols[idxCancel].replace(/["']/g, '').trim().toUpperCase();
                            if (cancelVal && cancelVal !== 'FALSE' && cancelVal !== '0') {
                                isCancelled = true;
                            }
                        }

                        if (pName) {
                            addedTotal++;
                            if (isCancelled) {
                                cancelledTotal++;
                            } else {
                                activeTotal++;
                                if (pName.includes('flexible')) { planCounts['Flexible']++; }
                                else if (pName.includes('30')) { planCounts['Unlimited 30']++; }
                                else if (pName.includes('365')) { planCounts['Unlimited 365']++; }
                            }
                        }
                    });
                    setPlanData([
                        { name: 'Flexible', count: planCounts['Flexible'], color: '#fbbf24' },
                        { name: 'Unlimited 30', count: planCounts['Unlimited 30'], color: '#3b82f6' },
                        { name: 'Unlimited 365', count: planCounts['Unlimited 365'], color: '#4f46e5' }
                    ]);
                    setTotalPaidUsers(activeTotal);
                    setPaidAdded(addedTotal);
                    setPaidCancelled(cancelledTotal);
                    setHasPaymentData(true);
                } catch (e) { console.error(e); }
            };

            const totalInstalls = useMemo(() => weeklyData.reduce((acc, curr) => acc + (Number(curr.newInstalls) || 0), 0), [weeklyData]);
            const totalCompleted = useMemo(() => weeklyData.reduce((acc, curr) => acc + (Number(curr.s3) || 0), 0), [weeklyData]);
            const onboardingRate = useMemo(() => {
                return totalInstalls > 0 ? ((totalCompleted / totalInstalls) * 100).toFixed(1) : "0.0";
            }, [totalInstalls, totalCompleted]);

            const activeTrendData = useMemo(() => {
                const source = trendViewMode === 'daily' ? dailyStats : trendViewMode === 'weekly' ? weeklyData : monthlyStats;
                if (!source || source.length === 0) return INITIAL_DATA;
                return source.map(d => ({ label: d.label, installs: d.newInstalls, uninstalls: d.uninstalls, closed: d.storeClosed, paid: d.paid, retentionRate: d.retentionRate }));
            }, [trendViewMode, dailyStats, weeklyData, monthlyStats]);

            const activeEarlyChurnData = useMemo(() => {
                const source = earlyChurnViewMode === 'daily' ? dailyStats : earlyChurnViewMode === 'weekly' ? weeklyData : monthlyStats;
                if (!source || source.length === 0) return INITIAL_DATA;
                return source.map(d => ({ label: d.label, installs: d.newInstalls, earlyUninstalls: d.earlyUninstalls, earlyClosed: d.earlyClosed, earlyChurnRate: d.earlyChurnRate }));
            }, [earlyChurnViewMode, dailyStats, weeklyData, monthlyStats]);

            const activeOnboardingData = useMemo(() => {
                const source = onboardingViewMode === 'daily' ? dailyStats : onboardingViewMode === 'weekly' ? weeklyData : monthlyStats;
                return source && source.length > 0 ? source : INITIAL_DATA;
            }, [onboardingViewMode, dailyStats, weeklyData, monthlyStats]);

            const activeSummaryData = useMemo(() => {
                const source = summaryViewMode === 'daily' ? dailyStats : summaryViewMode === 'weekly' ? weeklyData : monthlyStats;
                return source && source.length > 0 ? source.slice().reverse() : [];
            }, [summaryViewMode, dailyStats, weeklyData, monthlyStats]);

            const cohortChartData = useMemo(() => {
                if (!compStats || compStats.length === 0) return [];
                const cohorts = ['기존 (Legacy)', '1차 개선', '2차 개선 (현재)'];
                const cohortKeys = ['legacy', 'imp1', 'imp2'];
                return cohorts.map((cohortName, idx) => {
                    const key = cohortKeys[idx];
                    const dataPoint = { name: cohortName, groupKey: key };
                    compStats.forEach(stat => {
                        dataPoint[stat.step] = parseFloat(stat[key].rate);
                        dataPoint[`${stat.step}_prev`] = stat[key].prev;
                        dataPoint[`${stat.step}_legacy`] = stat.legacy.rate;
                    });
                    return dataPoint;
                });
            }, [compStats]);

            return (
                <div className="min-h-screen bg-slate-50 p-4 md:p-8 font-sans text-slate-800 text-[13px]">
                    <style>{CustomScrollbarStyle}</style>
                    <header className="max-w-7xl mx-auto mb-8 flex flex-col md:flex-row justify-between items-start md:items-end gap-4">
                        <div>
                            <h1 className="text-3xl font-black text-slate-900 tracking-tight uppercase">Shopify Growth Dashboard</h1>
                            <div className="flex gap-2 mt-2">
                                {hasOnboardingData && <span className="px-2 py-0.5 bg-emerald-100 text-emerald-700 text-[10px] font-bold rounded-full flex items-center"><FileText className="w-3 h-3 mr-1" /> 온보딩 데이터 활성</span>}
                                {hasPaymentData && <span className="px-2 py-0.5 bg-blue-100 text-blue-700 text-[10px] font-bold rounded-full flex items-center"><CreditCard className="w-3 h-3 mr-1" /> 결제 데이터 활성</span>}
                                <span className="px-2 py-0.5 bg-indigo-100 text-indigo-700 text-[10px] font-bold rounded-full flex items-center"><Cloud className="w-3 h-3 mr-1" /> 로컬 영구 저장 활성</span>
                            </div>
                        </div>
                        <div className="flex gap-2">
                            <input type="file" ref={fileInputRef} onChange={handleFileUpload} accept=".csv" className="hidden" />
                            <button
                                onClick={() => fileInputRef.current.click()}
                                className="flex items-center px-4 py-2 bg-slate-800 text-white rounded-xl font-bold text-sm shadow-lg hover:bg-slate-700 transition ring-2 ring-slate-200 ring-offset-2 tracking-tight cursor-pointer"
                            >
                                <span className="flex items-center"><Upload className="w-4 h-4 mr-2" /> 데이터 업로드</span>
                            </button>
                        </div>
                    </header>

                    {/* 날짜 필터 */}
                    <div className="max-w-7xl mx-auto mb-6 flex flex-col sm:flex-row items-start sm:items-center gap-3 bg-white p-3 rounded-2xl shadow-sm border border-slate-200">
                        <span className="text-xs font-bold text-slate-600 flex items-center px-2"><CalendarDays className="w-4 h-4 mr-1.5" /> 데이터 조회 기간</span>
                        <div className="flex items-center">
                            <input type="date" value={filterStartDate} onChange={e => setFilterStartDate(e.target.value)} className="text-xs font-mono font-bold text-slate-600 px-3 py-1.5 border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-indigo-500" />
                            <span className="text-slate-300 mx-2 font-black">-</span>
                            <input type="date" value={filterEndDate} onChange={e => setFilterEndDate(e.target.value)} className="text-xs font-mono font-bold text-slate-600 px-3 py-1.5 border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-indigo-500" />
                        </div>
                        {(filterStartDate || filterEndDate) && (
                            <button onClick={() => {setFilterStartDate(''); setFilterEndDate('');}} className="text-[11px] text-red-500 bg-red-50 hover:bg-red-100 transition rounded-lg font-bold px-3 py-1.5 ml-2">초기화</button>
                        )}
                        <span className="text-[10px] text-slate-400 ml-auto hidden md:block">그래프 영역을 드래그하여 좌우로 스크롤 할 수 있습니다.</span>
                    </div>

                    {!hasOnboardingData && (
                        <div className="max-w-7xl mx-auto mb-6 p-6 bg-white border-2 border-dashed border-slate-200 rounded-2xl text-center">
                            <p className="text-slate-400 font-medium font-sans">업로드된 CSV 데이터가 없습니다. 우측 상단의 [데이터 업로드] 버튼을 눌러주세요.</p>
                        </div>
                    )}

                    <div className="max-w-7xl mx-auto space-y-6">
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                            <MetricCard title="Total Installs (누적)" value={totalInstalls.toLocaleString()} subtext="분석 기간 전체 가입" icon={Users} trend={null} />
                            <MetricCard title="Onboarding Completed (누적)" value={totalCompleted.toLocaleString()} subtext={`설치 대비 완료율 ${onboardingRate}%`} icon={CheckCircle} trend={null} />
                            <MetricCard
                                title="Total Paid Users (Active)"
                                value={totalPaidUsers.toLocaleString()}
                                subtext="해지 제외 현재 유지 고객사"
                                icon={DollarSign}
                                customTrend={
                                    hasPaymentData ? (
                                        <div className="flex gap-2">
                                            <span className="flex items-center text-[11px] font-bold text-emerald-600 bg-emerald-50 px-1.5 py-0.5 rounded" title="추가된 고객사">
                                                <ArrowUpRight className="w-3 h-3 mr-0.5" />{paidAdded}
                                            </span>
                                            <span className="flex items-center text-[11px] font-bold text-red-500 bg-red-50 px-1.5 py-0.5 rounded" title="해지된 고객사">
                                                <ArrowDownRight className="w-3 h-3 mr-0.5" />{paidCancelled}
                                            </span>
                                        </div>
                                    ) : null
                                }
                            />
                        </div>

                        {/* 1. 앱 설치 및 이탈 추이 */}
                        <div className="bg-white p-8 rounded-2xl shadow-sm border border-slate-100">
                            <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4">
                                <h3 className="text-lg font-bold flex items-center text-slate-800">
                                    <Calendar className="w-5 h-5 text-indigo-500 mr-3" />
                                    앱 설치, 이탈 및 유료 결제 추이
                                </h3>
                                <ViewModeSelector mode={trendViewMode} setMode={setTrendViewMode} />
                            </div>
                            <div className="h-80 w-full relative">
                                <DraggableChartContainer dataLength={activeTrendData.length} mode={trendViewMode}>
                                    <ResponsiveContainer width="100%" height="100%">
                                        <ComposedChart data={activeTrendData} margin={{ top: 20, left: -20, right: -10 }} barGap={2}>
                                            <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#f1f5f9" />
                                            <XAxis dataKey="label" tick={{fontSize: 10, fontWeight: 600}} axisLine={false} tickLine={false} />
                                            <YAxis yAxisId="left" tick={{fontSize: 11}} axisLine={false} tickLine={false} />
                                            <YAxis yAxisId="right" orientation="right" tick={{fontSize: 10, fill: '#10b981'}} axisLine={false} tickLine={false} domain={[0, 100]} unit="%" />
                                            <Tooltip content={<OnboardingTooltip />} />
                                            <Legend iconType="circle" wrapperStyle={{paddingTop: '20px', fontSize: '11px'}} />
                                            <Bar yAxisId="left" dataKey="installs" name="신규 설치" fill="#818cf8" radius={[4, 4, 0, 0]} barSize={12}>
                                                <LabelList dataKey="installs" position="top" offset={5} style={{ fontSize: '10px', fill: '#4f46e5', fontWeight: 'bold' }} formatter={(v) => v > 0 ? v : ''} />
                                            </Bar>
                                            <Bar yAxisId="left" dataKey="paid" name="유료 결제" fill="#0ea5e9" radius={[4, 4, 0, 0]} barSize={12}>
                                                <LabelList dataKey="paid" position="top" offset={5} style={{ fontSize: '10px', fill: '#0284c7', fontWeight: 'bold' }} formatter={(v) => v > 0 ? v : ''} />
                                            </Bar>
                                            <Bar yAxisId="left" dataKey="uninstalls" name="앱 삭제" fill="#f87171" radius={[4, 4, 0, 0]} barSize={12} />
                                            <Bar yAxisId="left" dataKey="closed" name="폐업" fill="#eab308" radius={[4, 4, 0, 0]} barSize={12} />
                                            <Line yAxisId="right" type="monotone" dataKey="retentionRate" name="순 설치 유지율 (%)" stroke="#10b981" strokeWidth={2} strokeDasharray="4 4" dot={{r: 3, fill: '#10b981'}}>
                                                <LabelList dataKey="retentionRate" position="top" offset={8} style={{ fontSize: '10px', fill: '#059669', fontWeight: 'bold' }} formatter={(v) => v > 0 ? `${v}%` : ''} />
                                            </Line>
                                        </ComposedChart>
                                    </ResponsiveContainer>
                                </DraggableChartContainer>
                            </div>
                        </div>

                        {/* 2. 온보딩 단계별 완료율 */}
                        <div className="bg-white p-8 rounded-2xl shadow-sm border border-slate-100">
                            <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4">
                                <h3 className="text-lg font-bold flex items-center text-slate-800">
                                    <span className="w-1.5 h-5 bg-indigo-500 rounded-full mr-3"></span>
                                    온보딩 단계별 완료율
                                </h3>
                                <ViewModeSelector mode={onboardingViewMode} setMode={setOnboardingViewMode} />
                            </div>
                            <div className="h-80 w-full relative">
                                <DraggableChartContainer dataLength={activeOnboardingData.length} mode={onboardingViewMode}>
                                    <ResponsiveContainer width="100%" height="100%">
                                        <LineChart data={activeOnboardingData} margin={{ left: -20, top: 10, right: 10 }}>
                                            <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#f1f5f9" />
                                            <XAxis dataKey="label" tick={{fontSize: 11, fontWeight: 600}} axisLine={false} tickLine={false} />
                                            <YAxis domain={[0, 100]} tick={{fontSize: 11}} axisLine={false} tickLine={false} />
                                            <Tooltip content={<OnboardingTooltip />} />
                                            <Legend iconType="circle" wrapperStyle={{paddingTop: '20px', fontSize: '11px'}} />
                                            <Line type="monotone" dataKey="step1" name="1.정보 확인" stroke="#94a3b8" strokeDasharray="5 5" dot={false} strokeWidth={1.5} />
                                            <Line type="monotone" dataKey="step2_1" name="2-1.색상 선택" stroke="#818cf8" strokeWidth={1.5} dot={{r:2}} />
                                            <Line type="monotone" dataKey="step2_2" name="2-2.Core Snippet" stroke="#6366f1" strokeWidth={1.5} dot={{r:2}} />
                                            <Line type="monotone" dataKey="step2_3" name="2-3.위젯 설치" stroke="#4f46e5" strokeWidth={1.5} dot={{r:2}} />
                                            <Line type="monotone" dataKey="step3" name="3.완료" stroke="#10b981" strokeWidth={3} dot={true} />
                                            <Line type="monotone" dataKey="exposedRate" name="▶ 위젯 노출" stroke="#f59e0b" strokeWidth={2} dot={{r:4}} />
                                        </LineChart>
                                    </ResponsiveContainer>
                                </DraggableChartContainer>
                            </div>
                        </div>

                        {/* 3. 플랜별 고객사 현황 */}
                        <div className="bg-white p-8 rounded-2xl shadow-sm border border-slate-100">
                            <h3 className="text-lg font-bold mb-6 flex items-center text-slate-800"><span className="w-1.5 h-5 bg-purple-500 rounded-full mr-3"></span>플랜별 고객사 현황</h3>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-10 items-center">
                                <div className="overflow-x-auto w-full text-sm">
                                    <table className="w-full">
                                        <thead className="text-slate-400 font-bold border-b border-slate-100 uppercase tracking-wider text-[11px]">
                                            <tr><th className="pb-3 text-left">플랜명</th><th className="pb-3 text-right">고객사</th><th className="pb-3 text-right">비중 (%)</th></tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-50 font-medium text-slate-600">
                                            {planData && planData.length > 0 ? planData.map((p, i) => (
                                                <tr key={i}><td className="py-4 flex items-center font-bold text-slate-700"><div className="w-2.5 h-2.5 rounded-full mr-3" style={{ backgroundColor: p.color }}></div>{p.name}</td><td className="py-4 text-right font-mono font-bold">{p.count}</td><td className="py-4 text-right text-slate-400">{totalPaidUsers > 0 ? ((p.count/totalPaidUsers)*100).toFixed(1) : 0}%</td></tr>
                                            )) : <tr><td colSpan="3" className="py-10 text-center text-slate-400 font-sans">데이터가 없습니다.</td></tr>}
                                        </tbody>
                                    </table>
                                </div>
                                <div className="h-64">
                                    <ResponsiveContainer>
                                        <PieChart>
                                            <Pie data={planData} innerRadius={60} outerRadius={90} paddingAngle={8} dataKey="count">
                                                {planData.map((e,i)=><Cell key={i} fill={e.color}/>)}
                                            </Pie>
                                            <Tooltip/>
                                        </PieChart>
                                    </ResponsiveContainer>
                                </div>
                            </div>
                        </div>

                        {/* 4. 온보딩 단계별 개선 추이 */}
                        <div className="bg-white p-8 rounded-2xl shadow-sm border border-slate-100">
                            <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4">
                                <h3 className="text-lg font-bold flex items-center text-slate-900">
                                    <Zap className="w-5 h-5 text-amber-500 mr-3" fill="currentColor" />
                                    온보딩 단계별 개선 추이 (그룹별 비교)
                                </h3>
                                {cohortFocus && (
                                    <button
                                        onClick={() => setCohortFocus(null)}
                                        className="text-[10px] bg-slate-800 text-white px-2 py-1 rounded flex items-center hover:bg-slate-700 transition"
                                    >
                                        <Filter className="w-3 h-3 mr-1" /> 필터 초기화
                                    </button>
                                )}
                            </div>
                            <div className="h-[450px]">
                                <ResponsiveContainer width="100%" height="100%">
                                    <BarChart data={cohortChartData} margin={{ top: 20, right: 30, left: -20, bottom: 5 }} barCategoryGap="25%" barGap={6}>
                                        <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#f1f5f9" />
                                        <XAxis dataKey="name" tick={{fontSize: 11, fontWeight: 'bold', fill: '#475569'}} axisLine={false} tickLine={false} />
                                        <YAxis domain={[0, 100]} tick={{fontSize: 11}} axisLine={false} tickLine={false} unit="%" />
                                        <Tooltip content={<CohortTooltip />} cursor={{fill: '#f8fafc'}} />
                                        <Legend
                                            iconType="circle"
                                            wrapperStyle={{paddingTop: '20px', fontSize: '11px', fontWeight: 'bold'}}
                                            onClick={(e) => setCohortFocus(prev => prev === e.value ? null : e.value)}
                                            cursor="pointer"
                                        />
                                        {Object.entries(COHORT_COLORS).map(([name, color]) => (
                                            <Bar
                                                key={name}
                                                dataKey={name}
                                                fill={color}
                                                radius={[4, 4, 0, 0]}
                                                barSize={26}
                                                hide={cohortFocus && cohortFocus !== name}
                                                onClick={() => setCohortFocus(prev => prev === name ? null : name)}
                                                cursor="pointer"
                                            >
                                                <LabelList
                                                    dataKey={name}
                                                    position="top"
                                                    offset={5}
                                                    style={{ fontSize: '9px', fill: color, fontWeight: 'bold' }}
                                                    formatter={(v) => v > 0 ? `${v}%` : ''}
                                                />
                                            </Bar>
                                        ))}
                                    </BarChart>
                                </ResponsiveContainer>
                            </div>
                        </div>

                        {/* 5. 국가별 가입 규모 및 전환 현황 */}
                        <div className="bg-white p-8 rounded-2xl shadow-sm border border-slate-100">
                            <h3 className="text-lg font-bold mb-6 flex items-center text-slate-800"><Globe className="w-5 h-5 text-blue-500 mr-3" />국가별 가입 규모 및 전환 현황 (Top 10 + 기타)</h3>
                            {countryStats && countryStats.length > 0 ? (
                                <div className="h-[480px]">
                                    <ResponsiveContainer width="100%" height="100%">
                                        <ComposedChart data={countryStats} margin={{ top: 10, right: 0, left: 0, bottom: 30 }}>
                                            <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#f1f5f9" />
                                            <XAxis dataKey="country" tick={{fontSize: 11, fontWeight: 'bold', fill: '#475569'}} interval={0} angle={-30} textAnchor="end" height={60} />
                                            <YAxis yAxisId="left" tick={{fontSize: 11}} axisLine={false} tickLine={false} />
                                            <YAxis yAxisId="right" orientation="right" domain={[0, 100]} unit="%" tick={{fontSize: 11, fill: '#10b981'}} axisLine={false} tickLine={false} />
                                            <Tooltip content={({ active, payload, label }) => {
                                                if (active && payload && payload.length) {
                                                    const d = payload[0].payload;
                                                    return (
                                                        <div className="bg-white p-3 rounded-lg shadow-xl border border-slate-100">
                                                            <p className="font-bold text-slate-900 border-b pb-1 mb-2">{label}</p>
                                                            <div className="space-y-1 text-xs font-sans">
                                                                <p className="flex justify-between gap-6"><span>신규 설치:</span> <span className="font-bold">{d.newInstalls}건</span></p>
                                                                <p className="flex justify-between gap-6 text-emerald-600 font-bold"><span>유지율:</span> <span>{d.retentionRate}%</span></p>
                                                                <p className="flex justify-between gap-6 text-indigo-600 font-bold"><span>온보딩 완료:</span> <span>{d.s3}건 ({d.onboardingRate}%)</span></p>
                                                                <p className="flex justify-between gap-6 text-amber-500 font-bold"><span>유료 결제:</span> <span>{d.paid}건 ({d.paidRate}%)</span></p>
                                                                <p className="flex justify-between gap-6 text-red-500"><span>앱 삭제:</span> <span>{d.uninstalls}건 ({d.uninstallRate}%)</span></p>
                                                            </div>
                                                        </div>
                                                    );
                                                }
                                                return null;
                                            }} />
                                            <Legend verticalAlign="top" align="right" iconType="circle" wrapperStyle={{ fontSize: '11px', fontWeight: 'bold', paddingBottom: '20px' }} />
                                            <Bar yAxisId="left" dataKey="newInstalls" name="전체 가입 수" fill="#e0e7ff" radius={[4, 4, 0, 0]} barSize={24} />
                                            <Bar yAxisId="left" dataKey="s3" name="온보딩 완료" fill="#818cf8" radius={[4, 4, 0, 0]} barSize={24} />
                                            <Bar yAxisId="left" dataKey="paid" name="유료 결제" fill="#f59e0b" radius={[4, 4, 0, 0]} barSize={24} />
                                            <Line yAxisId="right" type="monotone" dataKey="retentionRate" name="순 설치 유지율 (%)" stroke="#10b981" strokeWidth={2} dot={{r: 4, fill: '#10b981'}} strokeDasharray="4 4" />
                                            <Line yAxisId="right" type="monotone" dataKey="onboardingRate" name="온보딩 완료율 (%)" stroke="#4338ca" strokeWidth={2} dot={{r: 3, fill: '#4338ca'}} strokeDasharray="4 4" />
                                            <Line yAxisId="right" type="monotone" dataKey="paidRate" name="유료 전환율 (%)" stroke="#d97706" strokeWidth={2} dot={{r: 3, fill: '#d97706'}} strokeDasharray="4 4" />
                                        </ComposedChart>
                                    </ResponsiveContainer>
                                </div>
                            ) : <div className="h-64 flex items-center justify-center text-slate-400 font-sans">데이터가 없습니다.</div>}
                        </div>

                        {/* 6. 이탈 시점 분석 */}
                        <div className="bg-white p-8 rounded-2xl shadow-sm border border-slate-100">
                            <h3 className="text-lg font-bold mb-6 flex items-center text-slate-800"><UserMinus className="w-5 h-5 text-red-500 mr-3" />이탈 시점 분석 (Churn Analysis)</h3>
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-0">
                                <div className="col-span-1" style={{ marginTop: `${CHURN_HEADER_HEIGHT}px`, height: `${churnStats.length * CHURN_ROW_HEIGHT}px` }}>
                                    <ResponsiveContainer width="100%" height="100%">
                                        <BarChart data={churnStats} layout="vertical" margin={{ top: 0, bottom: 0, left: 10, right: 10 }}>
                                            <XAxis type="number" hide />
                                            <YAxis dataKey="range" type="category" width={80} tick={{ fontSize: 11, fontWeight: 'bold', fill: '#64748b' }} axisLine={false} tickLine={false} />
                                            <Tooltip contentStyle={{ borderRadius: '8px', border: 'none' }} />
                                            <Bar dataKey="uninstalls" name="앱 삭제" stackId="a" fill="#f87171" radius={[0, 0, 0, 0]} barSize={24} />
                                            <Bar dataKey="closed" name="폐업" stackId="a" fill="#eab308" radius={[0, 4, 4, 0]} barSize={24} />
                                        </BarChart>
                                    </ResponsiveContainer>
                                </div>
                                <div className="col-span-2 overflow-x-auto">
                                    <table className="w-full text-xs text-center border-collapse table-fixed">
                                        <thead className="bg-slate-50 text-slate-400 font-bold border-b border-slate-100 uppercase text-[10px]" style={{ height: `${CHURN_HEADER_HEIGHT}px` }}>
                                            <tr>
                                                <th className="px-2 text-left w-24">이탈 시점</th>
                                                <th className="px-2">앱 삭제 (건/%)</th>
                                                <th className="px-2">폐업 (건/%)</th>
                                                <th className="px-2 text-emerald-600 font-black">온보딩 완료(%)</th>
                                                <th className="px-2 text-indigo-600">위젯 노출(%)</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-50 font-medium font-sans">
                                            {churnStats && churnStats.length > 0 ? churnStats.map((s, i) => (
                                                <tr key={i} className="hover:bg-slate-50/50 transition-colors" style={{ height: `${CHURN_ROW_HEIGHT}px` }}>
                                                    <td className="px-2 text-left font-bold text-slate-700">{s.range}</td>
                                                    <td className="px-2 text-red-400 font-bold font-mono text-sm">{s.uninstalls} <span className="text-[10px] text-red-300 ml-1">({s.uninstallRate}%)</span></td>
                                                    <td className="px-2 text-yellow-500 font-bold font-mono text-sm">{s.closed} <span className="text-[10px] text-yellow-500 ml-1">({s.closedRate}%)</span></td>
                                                    <td className="px-2 text-emerald-700 font-bold">{s.s3Rate}%</td>
                                                    <td className="px-2 text-indigo-600 font-bold">{s.expRate}%</td>
                                                </tr>
                                            )) : <tr><td colSpan="5" className="py-10 text-center text-slate-400 font-sans">데이터가 없습니다.</td></tr>}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>

                        {/* 6-1. D+1 앱 삭제 추이 */}
                        <div className="bg-white p-8 rounded-2xl shadow-sm border border-slate-100">
                            <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4">
                                <h3 className="text-lg font-bold flex items-center text-slate-800">
                                    <TrendingUp className="w-5 h-5 text-red-500 mr-3" />
                                    D+1 앱 삭제 추이
                                </h3>
                                <ViewModeSelector mode={earlyChurnViewMode} setMode={setEarlyChurnViewMode} />
                            </div>
                            <div className="h-80 w-full relative">
                                <DraggableChartContainer dataLength={activeEarlyChurnData.length} mode={earlyChurnViewMode}>
                                    <ResponsiveContainer width="100%" height="100%">
                                        <ComposedChart data={activeEarlyChurnData} margin={{ top: 20, left: -20, right: -10 }} barGap={2}>
                                            <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#f1f5f9" />
                                            <XAxis dataKey="label" tick={{fontSize: 10, fontWeight: 600}} axisLine={false} tickLine={false} />
                                            <YAxis yAxisId="left" tick={{fontSize: 11}} axisLine={false} tickLine={false} />
                                            <YAxis yAxisId="right" orientation="right" tick={{fontSize: 10, fill: '#ef4444'}} axisLine={false} tickLine={false} domain={[0, 100]} unit="%" />
                                            <Tooltip content={<OnboardingTooltip />} />
                                            <Legend iconType="circle" wrapperStyle={{paddingTop: '20px', fontSize: '11px'}} />
                                            <Bar yAxisId="left" dataKey="installs" name="신규 설치" fill="#e2e8f0" radius={[4, 4, 0, 0]} barSize={16}>
                                                <LabelList dataKey="installs" position="top" offset={5} style={{ fontSize: '10px', fill: '#94a3b8', fontWeight: 'bold' }} formatter={(v) => v > 0 ? v : ''} />
                                            </Bar>
                                            <Bar yAxisId="left" dataKey="earlyUninstalls" name="D+1 앱 삭제" fill="#f87171" radius={[4, 4, 0, 0]} barSize={16}>
                                                <LabelList dataKey="earlyUninstalls" position="top" offset={5} style={{ fontSize: '10px', fill: '#ef4444', fontWeight: 'bold' }} formatter={(v) => v > 0 ? v : ''} />
                                            </Bar>
                                            <Line yAxisId="right" type="monotone" dataKey="earlyChurnRate" name="D+1 앱 삭제율 (%)" stroke="#ef4444" strokeWidth={2} strokeDasharray="4 4" dot={{r: 4, fill: '#ef4444'}}>
                                                <LabelList dataKey="earlyChurnRate" position="top" offset={8} style={{ fontSize: '10px', fill: '#dc2626', fontWeight: 'bold' }} formatter={(v) => Number(v) > 0 ? `${v}%` : ''} />
                                            </Line>
                                        </ComposedChart>
                                    </ResponsiveContainer>
                                </DraggableChartContainer>
                            </div>
                        </div>

                        {/* 7. 데이터 상세 요약 */}
                        <div className="bg-white p-8 rounded-2xl shadow-sm border border-slate-100 font-sans">
                            <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4 font-sans">
                                <h3 className="text-lg font-bold flex items-center text-slate-800">
                                    <LayoutList className="w-5 h-5 text-indigo-500 mr-3" />
                                    데이터 상세 요약
                                </h3>
                                <ViewModeSelector mode={summaryViewMode} setMode={setSummaryViewMode} />
                            </div>
                            <div className="overflow-x-auto">
                                <table className="w-full text-xs text-center border-collapse text-[11px] font-sans">
                                    <thead className="text-slate-400 border-b font-bold uppercase tracking-tighter text-[10px]">
                                        <tr>
                                            <th className="text-left py-3 px-2">{summaryViewMode === 'daily' ? '일자' : summaryViewMode === 'weekly' ? '주차' : '월'}</th>
                                            <th className="px-2">신규 설치</th>
                                            <th className="px-2 text-red-400">삭제</th>
                                            <th className="px-2 text-yellow-500">폐업</th>
                                            <th className="px-2 text-indigo-600 font-black">순 설치 (잔존)</th>
                                            <th className="px-2 text-emerald-600 font-black">완료율 (%)</th>
                                            <th className="px-2 text-indigo-400 font-black">위젯 노출 (%)</th>
                                            <th className="px-2 text-green-700 font-black">유료 결제</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y font-medium text-slate-600 font-mono font-sans">
                                        {activeSummaryData && activeSummaryData.length > 0 ? activeSummaryData.map((r, i) => (
                                            <tr key={i} className="hover:bg-slate-50/50 transition">
                                                <td className="text-left py-4 px-2 font-bold text-slate-700 font-sans">{r.label}</td>
                                                <td className="px-2 font-mono">{r.newInstalls}</td>
                                                <td className="px-2 text-red-400 opacity-80 font-mono">{r.uninstalls}</td>
                                                <td className="px-2 text-yellow-500 opacity-80 font-mono">{r.storeClosed}</td>
                                                <td className="px-2 bg-indigo-50/20 text-indigo-600 font-black font-mono">{r.netInstalls}</td>
                                                <td className="px-2 bg-emerald-50/30 text-emerald-700 font-bold font-mono">{r.step3}%</td>
                                                <td className="px-2 text-indigo-400 font-bold font-mono">{r.exposedRate}%</td>
                                                <td className="px-2 bg-green-50/30 text-green-700 font-black font-mono">{r.paid}</td>
                                            </tr>
                                        )) : <tr><td colSpan="8" className="py-10 text-center text-slate-400 font-sans">데이터가 없습니다.</td></tr>}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        const rootElement = document.getElementById('root');
        if (ReactDOM.createRoot) {
            const root = ReactDOM.createRoot(rootElement);
            root.render(<App />);
        } else {
            ReactDOM.render(<App />, rootElement);
        }
    </script>
</body>
</html>
